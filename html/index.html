<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instituto Sementes do Amanhã</title>
  <!-- Aplica o tema escolhido antes da primeira pintura, para não piscar branco -->
  <script>
    (function () {
      var salvo = null;

      try { salvo = window.localStorage.getItem("sementes:tema"); } catch (erro) { salvo = null; }

      var escuro = salvo ? salvo === "escuro" : window.matchMedia("(prefers-color-scheme: dark)").matches;

      document.documentElement.setAttribute("data-bs-theme", escuro ? "dark" : "light");
    })();
  </script>

  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Primeiro elemento focavel da pagina: aparece no primeiro Tab (WCAG 2.4.1) -->
  <a class="pular-navegacao" href="#app">Pular para o conteúdo principal</a>

  <header>
    <!-- Barra do Bootstrap: no celular o proprio Bootstrap abre o menu -->
    <nav class="navbar navbar-expand-md navbar-dark bg-verde" aria-label="Navegação principal">
      <div class="container">
        <a class="navbar-brand" href="#/inicio">Sementes do Amanhã</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#/inicio">Projetos</a></li>
            <li class="nav-item"><a class="nav-link" href="#/cadastro">Quero participar</a></li>
            <li class="nav-item"><a class="nav-link" href="#/cadastros">Cadastros salvos</a></li>
          </ul>

          <button class="btn btn-sm btn-outline-light mt-3 mt-md-0 ms-md-3" type="button" id="botao-tema" aria-pressed="false">Modo escuro</button>
        </div>
      </div>
    </nav>
  </header>

  <!-- O conteudo de cada tela entra aqui pelo JavaScript -->
  <!-- tabindex="-1" permite receber o foco depois da troca de tela (WCAG 2.4.3) -->
  <main id="app" class="container py-4" tabindex="-1"></main>

  <footer class="bg-verde text-white py-3">
    <div class="container">Trabalho acadêmico de Desenvolvimento Front-end - 2025</div>
  </footer>

  <!-- Aviso rapido: componente Toast do Bootstrap -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="3000">
      <div class="toast-body d-flex align-items-center gap-3">
        <span id="toast-texto"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
      </div>
    </div>
  </div>

  <!-- Ordem importa: primeiro o Bootstrap, depois os nossos arquivos -->
  <script src="../js/bootstrap.bundle.min.js" defer></script>
  <script src="../js/dados.js" defer></script>
  <script src="../js/telas.js" defer></script>
  <script src="../js/formulario.js" defer></script>
  <script src="../js/app.js" defer></script>

</body>
</html>
